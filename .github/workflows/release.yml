name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-alpha*"
      - "!v*-rc*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Checkout the release tag
        run: git checkout "$GITHUB_TAG"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Release tags correspond to the Hatchet engine version baked into the
      # sidecar: vX.Y.Z, or vX.Y.Z-N for sidecar-only fixes on the same engine.
      - name: Verify tag matches the embedded Hatchet version
        run: |
          dep=$(go list -m -f '{{.Version}}' github.com/hatchet-dev/hatchet)
          case "$GITHUB_TAG" in
            "$dep" | "$dep"-*) echo "tag $GITHUB_TAG corresponds to hatchet $dep" ;;
            *)
              echo "tag $GITHUB_TAG does not correspond to the embedded hatchet version $dep"
              exit 1
              ;;
          esac

      - name: Install quill (for macOS code signing)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/quill/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
