name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVER_SECURITY_CHECK_ENABLED: "false"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  examples-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: go build ./...
      - name: run examples/go
        run: |
          timeout 300 go run ./examples/go > out.log 2>&1 || (cat out.log && exit 1)
          cat out.log
          grep -q "Hello, embed!" out.log

  examples-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: go build -o /tmp/hatchet-embedded-sidecar ./cmd/sidecar
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install -r examples/python/requirements.txt
      - name: run examples/python
        env:
          HATCHET_CLIENT_EMBEDDED_BINARY_PATH: /tmp/hatchet-embedded-sidecar
        run: |
          timeout 300 python examples/python/main.py > out.log 2>&1 || (cat out.log && exit 1)
          cat out.log
          grep -q "Hello, embed!" out.log

  # exercises the real release download path (version resolution, sidecar
  # download, and checksum verification against the latest published release),
  # which the other example jobs skip via HATCHET_CLIENT_EMBEDDED_BINARY_PATH.
  # The SDK downloads from plain github.com release URLs, which need no
  # authentication, so no GITHUB_TOKEN is plumbed through. Kept to a single
  # platform with a generous timeout since it depends on the network.
  examples-python-release-download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install -r examples/python/requirements.txt
      - name: run examples/python against the latest release
        run: |
          timeout 600 python examples/python/main.py > out.log 2>&1 || (cat out.log && exit 1)
          cat out.log
          grep -q "Hello, embed!" out.log

  examples-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: go build -o /tmp/hatchet-embedded-sidecar ./cmd/sidecar
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
      - run: npm install -g pnpm@10.16.1
      - run: pnpm install
        working-directory: examples/typescript
      - name: run examples/typescript
        working-directory: examples/typescript
        env:
          HATCHET_CLIENT_EMBEDDED_BINARY_PATH: /tmp/hatchet-embedded-sidecar
        run: |
          timeout 300 pnpm start > out.log 2>&1 || (cat out.log && exit 1)
          cat out.log
          grep -q "Hello, embed!" out.log
