name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  examples-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - name: run examples/go
        run: |
          out=$(timeout 300 go run ./examples/go)
          echo "$out"
          echo "$out" | grep -q "Hello, embed!"

  examples-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o /tmp/hatchet-embedded-sidecar ./cmd/sidecar
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install -r examples/python/requirements.txt
      - name: run examples/python
        env:
          HATCHET_CLIENT_EMBEDDED_BINARY_PATH: /tmp/hatchet-embedded-sidecar
        run: |
          out=$(timeout 300 python examples/python/main.py)
          echo "$out"
          echo "$out" | grep -q "Hello, embed!"

  examples-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o /tmp/hatchet-embedded-sidecar ./cmd/sidecar
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
      - run: npm install -g pnpm@10.16.1
      - run: pnpm install
        working-directory: examples/typescript
      - name: run examples/typescript
        working-directory: examples/typescript
        env:
          HATCHET_CLIENT_EMBEDDED_BINARY_PATH: /tmp/hatchet-embedded-sidecar
        run: |
          out=$(timeout 300 pnpm start)
          echo "$out"
          echo "$out" | grep -q "Hello, embed!"
